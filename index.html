<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SwipeMatch</title>
    <link rel="shortcut icon" href="./photos/favicon.png" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <title>SwipeMatch</title>
    <main>
        <section>
            <header>
                <img src="./photos/tinder-logo.webp" alt="Tinder Logo">
            </header>

            <div class="cards">
                <article>
                    <img src="./photos/2.webp" alt="Hombre">
                    <h2>Álex <span> 25</span></h2>
                    <div class="choice nope">NOPE</div>
                    <div class="choice like">LIKE</div>    
                </article>
                
                <article>
                    <img src="./photos/1.webp" alt="Mujer">
                    <h2>Leila <span> 27</span></h2>
                    <div class="choice nope">NOPE</div>
                    <div class="choice like">LIKE</div>    
                </article>

                <span>
                    No hay más personas cerca de ti... <br/>
                    Vuelve más tarde
                </span>
            </div>

            <footer>
                <button class="is-undo" aria-label="undo"></button>
                <button class="is-remove is-big" aria-label="remove"></button>
                <button class="is-star" aria-label="star"></button>
                <button class="is-fav is-big" aria-label="fav"></button>
                <button class="is-zap" aria-label="zap"></button>
            </footer>
        </section>
    </main>

    <script src="./script.js"></script>

</body>

</html>
